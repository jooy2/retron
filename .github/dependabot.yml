version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'package'
    groups:
      # Keeping the toolchain in a single pull request avoids a series of
      # builds that can only be verified together.
      development:
        dependency-type: development
      production:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'package'
